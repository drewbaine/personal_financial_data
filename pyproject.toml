[project]
name = "finance"
version = "0.1.0"
description = "Personal financial data: Plaid ingestion, local storage, and a read-only MCP server for Claude"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "mcp[cli]>=2.3.0",
    "plaid-python>=45.0.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
]

[project.scripts]
finance = "finance:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
